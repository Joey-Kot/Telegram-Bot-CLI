name: Build and publish Latest

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-release
  cancel-in-progress: false

jobs:
  quality:
    name: Check formatting, lint, and tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.package }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: tgpush-linux-x86_64
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: tgpush-linux-arm64
            archive: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: tgpush-windows-x86_64
            archive: zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            package: tgpush-windows-arm64
            archive: zip
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            package: tgpush-macos-x86_64
            archive: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            package: tgpush-macos-arm64
            archive: tar.gz

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/${{ matrix.package }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/tgpush" "$stage/"
          cp README.md README_ZH.md LICENSE NOTICE "$stage/"
          chmod 755 "$stage/tgpush"
          tar -C "$stage" -czf "dist/${{ matrix.package }}.tar.gz" tgpush README.md README_ZH.md LICENSE NOTICE
          cd dist
          shasum -a 256 "${{ matrix.package }}.tar.gz" > "${{ matrix.package }}.tar.gz.sha256"

      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "dist/${{ matrix.package }}"
          $archive = "dist/${{ matrix.package }}.zip"
          New-Item -ItemType Directory -Force -Path $stage
          Copy-Item "target/${{ matrix.target }}/release/tgpush.exe" $stage
          Copy-Item README.md, README_ZH.md, LICENSE, NOTICE $stage
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.package }}.zip" | Set-Content -Encoding ascii "$archive.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: |
            dist/${{ matrix.package }}.${{ matrix.archive }}
            dist/${{ matrix.package }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    name: Replace Latest release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate aggregate checksum file
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 *.tar.gz *.zip > SHA256SUMS

      - name: Replace Latest tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view Latest; then
            gh release delete Latest --yes
          fi
          git tag --force Latest "$GITHUB_SHA"
          git push origin refs/tags/Latest --force
          gh release create Latest dist/* \
            --title "Latest" \
            --notes "Automated multi-platform build from commit $GITHUB_SHA." \
            --latest \
            --verify-tag
